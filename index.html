<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <nav class="container">
            <div class="logo" id="nav-logo">Portfolio</div>
            <div class="nav-links">
                <a href="#about">About</a>
                <a href="#experience">Experience</a>
                <a href="#projects">Projects</a>
                <a href="#awards">Awards</a>
                <a href="#skills">Skills</a>
                <a href="#contact">Contact</a>
                <a href="files/vinod-akula-resume.pdf" target="_blank">Resume</a>
            </div>
        </nav>
    </header>

    <main>
        <section id="hero" class="hero">
            <div class="hero-content container">
                <h1 id="hero-name">Loading...</h1>
                <h2 id="hero-title"></h2>
                <p id="hero-summary"></p>
                <a href="#contact" class="btn">Get In Touch</a>
            </div>
        </section>

        <section id="experience" class="container">
            <h2 class="section-title">Experience</h2>
            <div id="experience-list" class="timeline">
                <!-- Dynamic Content -->
            </div>
        </section>

        <section id="education" class="container">
            <h2 class="section-title">Education</h2>
            <div id="education-list" class="timeline">
                <!-- Dynamic Content -->
            </div>
        </section>

        <section id="projects" class="container">
            <h2 class="section-title">Projects</h2>
            <div id="projects-list" class="timeline">
                <!-- Dynamic Content -->
            </div>
        </section>

        <section id="awards" class="container">
            <h2 class="section-title">Awards & Certifications</h2>
            <div id="awards-list" class="timeline">
                <!-- Dynamic Content -->
            </div>
        </section>

        <section id="skills" class="container">
            <h2 class="section-title">Skills</h2>
            <div id="skills-list" class="skills-grid">
                <!-- Dynamic Content -->
            </div>
        </section>

        <section id="contact" class="container">
            <h2 class="section-title">Contact</h2>
            <div id="contact-list" class="contact-grid">
                <!-- Dynamic Content -->
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; <span id="year"></span> <span id="footer-name"></span>. All rights reserved.</p>
        </div>
    </footer>

    <!-- Load data first -->
    <script src="data.js?v=2"></script>
    <script src="script.js"></script>
</body>

</html>
