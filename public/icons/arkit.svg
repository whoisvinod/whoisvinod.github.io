<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for the App Icon Squircle -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#54C5FF" />
      <stop offset="100%" stop-color="#007AFF" />
    </linearGradient>

    <!-- Drop Shadow for the Icon -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Solid Light Background -->
  <rect width="100%" height="100%" fill="#F5F5F7" />

  <!-- ARKit Squircle Icon Container -->
  <g filter="url(#dropShadow)">
    <rect x="290" y="60" width="220" height="220" rx="50" fill="url(#bgGrad)" />
  </g>

  <!-- White Interlocking "AR" Monogram -->
  <g fill="none" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <!-- The Left "A" Leg / Arc Loop -->
    <path d="M 345,215 L 345,155 C 345,130 365,125 380,125 C 395,125 400,135 400,150 L 400,215" stroke-opacity="0.95" />
    <!-- The Crossbar connecting A to R -->
    <path d="M 345,178 L 420,178" stroke-opacity="0.95" />
    <!-- The Right "R" Loop and Leg -->
    <path d="M 420,178 L 420,150 C 420,130 435,125 450,125 C 465,125 475,135 475,150 C 475,165 465,178 445,178 L 420,178 M 445,178 L 475,215" stroke-opacity="0.95" />
  </g>

  <!-- Typography: ARKit -->
  <text x="400" y="345" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="52" 
        font-weight="700" 
        fill="#1D1D1F" 
        text-anchor="middle" 
        letter-spacing="-1">ARKit</text>

  <!-- Typography: APPLE DEVELOPER SUBTEXT -->
  <text x="400" y="385" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="18" 
        font-weight="600" 
        fill="#86868B" 
        text-anchor="middle" 
        letter-spacing="2">APPLE DEVELOPER</text>
</svg>
