    <circle class="bg-circle" cx="109" cy="55" r="4" />

    <line class="glove-blue-stroke" x1="125" y1="135" x2="125" y2="65" />
    <circle class="glove-blue" cx="125" cy="65" r="10" />
    <circle class="bg-circle" cx="125" cy="65" r="4" />

    <line class="glove-blue-stroke" x1="126" y1="205" x2="159" y2="135" />
    <circle class="glove-blue" cx="159" cy="135" r="10" />
    <circle class="bg-circle" cx="159" cy="135" r="4" />
    
    <line class="gap-line" x1="131" y1="205" x2="151" y2="161" />
