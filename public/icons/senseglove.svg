    <path class="gap-line" d="M 68,160 L 89,142 L 131,142 L 152,160" fill="none" />

    <line class="glove-blue-stroke" x1="77" y1="150" x2="77" y2="85" />
    <circle class="glove-blue" cx="77" cy="85" r="10" />
    <circle class="bg-circle" cx="77" cy="85" r="4" />

    <line class="glove-blue-stroke" x1="93" y1="135" x2="93" y2="70" />
    <circle class="glove-blue" cx="93" cy="70" r="10" />
    <circle class="bg-circle" cx="93" cy="70" r="4" />

    <line class="glove-blue-stroke" x1="109" y1="135" x2="109" y2="55" />
