      .gap-line { stroke: #0e0d21; stroke-width: 4; stroke-linecap: round; }
      .brand-text {
        font-family: 'Montserrat', 'Helvetica Neue', 'Segoe UI', Arial, sans-serif;
        font-weight: 700;
        fill: #0e0d21;
        font-size: 104px;
        letter-spacing: 0.16em;
      }
    </style>
  </defs>

  <circle class="bg-circle" cx="125" cy="125" r="110" />

  <g id="glove-hand">
